<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
  <title>Presenter Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <label>Big screen <select id="display"></select></label>
    <button id="refresh" title="Re-detect displays">⟳</button>
    <select id="outline" title="Jump to a note"></select>
    <button id="mode" title="Switch between your notepad and a notes file"></button>
    <button id="open">Open notes…</button>
    <button id="prev" title="Ctrl+Alt+Left">◀</button>
    <span id="counter">0/0</span>
    <button id="next" title="Ctrl+Alt+Right">▶</button>
    <button id="tele" title="Ctrl+Alt+Space">Teleprompter</button>
    <label class="check"><input type="checkbox" id="ontop"> Always on top</label>
    <label class="check"><input type="checkbox" id="hide"> Hide from screen sharing</label>
    <span class="spacer"></span>
    <button id="clean" title="Hide everything except the preview (H, or Ctrl+Alt+H from anywhere)">Clean view</button>
    <button id="layout" title="Notes only / preview only / both (N)">Layout</button>
    <button id="freeze" title="Freeze / resume the preview (P)">Freeze</button>
    <button id="theme" title="Light / dark theme (T)">Theme</button>
    <button id="font-" title="Smaller text">A−</button>
    <button id="font+" title="Larger text">A+</button>
    <input id="target" type="number" min="0" max="600" placeholder="min" title="Talk length in minutes (timer turns red when exceeded)">
    <span id="timer">00:00:00</span>
    <button id="timer-toggle">Start</button>
    <button id="timer-reset">Reset</button>
  </header>
  <main>
    <section id="preview"><video id="video" autoplay muted></video><p id="status"></p></section>
    <div id="divider" title="Drag to resize (double-click to reset)"></div>
    <section id="notes"></section>
    <section id="pad">
      <div id="padbar">
        <button data-cmd="bold" title="Bold"><b>B</b></button>
        <button data-cmd="italic" title="Italic"><i>I</i></button>
        <button data-cmd="underline" title="Underline"><u>U</u></button>
        <span class="sep"></span>
        <span class="lbl">Text</span>
        <button class="swatch" data-fg="#ff5c5c" title="Red"></button>
        <button class="swatch" data-fg="#ffb347" title="Orange"></button>
        <button class="swatch" data-fg="#ffe14d" title="Yellow"></button>
        <button class="swatch" data-fg="#5fd068" title="Green"></button>
        <button class="swatch" data-fg="#4dc3ff" title="Blue"></button>
        <button class="swatch" data-fg="#c792ea" title="Purple"></button>
        <input type="color" id="fg" value="#ff5c5c" title="Any text color">
        <span class="lbl">Highlight</span>
        <input type="color" id="bg" value="#ffe14d" title="Highlight color">
        <button id="nohl" title="Remove highlight">none</button>
        <span class="sep"></span>
        <button id="padsize-" title="Smaller text">A-</button>
        <span id="padsize">16</span>
        <button id="padsize+" title="Larger text">A+</button>
        <button id="padreset" title="Remove colors and styles from the selection">Clear style</button>
      </div>
      <div id="padtext" contenteditable="true" spellcheck="false" data-placeholder="Paste or type your text here. It is saved automatically."></div>
    </section>
  </main>
  <script src="markdown.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
